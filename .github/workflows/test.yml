name: Test Project Harness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell tests
        shell: pwsh
        run: ./tests/run-tests.ps1

  shell:
    name: POSIX shell on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shell tests
        run: sh tests/run-tests.sh
